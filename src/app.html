<!doctype html>
<html lang="en">
	<head>
		<!-- default tags for html homepage -->
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="description" content="Emily Huang | Data Analyst based in Chino Hills, CA with a strong foundation in product strategy and consumer research">
    	<meta http-equiv="X-UA-Compatible" content="ie=edge">

		<!-- open graph descriptions -->
		<meta property="og:type" content="website">
		<meta property="og:title" content="emilyhuang.io">
		<meta property="og:description" content="Emily Huang | Data Analyst based in Chino Hills, CA with a strong foundation in product strategy and consumer research">
		<meta property="og:image" content="static/emilyhuang.webp">

		<!-- google fonts-->
		<link rel="preconnect" href="https://fonts.googleapis.com">
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
		<link href="https://fonts.googleapis.com/css2?family=Sora:wght@100..800&display=swap" rel="stylesheet"><link rel="icon" href="%sveltekit.assets%/favicon.png" />

		<!-- tab icon -->
		<link rel="icon" type="image/png" href="/favicon.png" sizes="96x96" />
		<link rel="icon" type="image/svg+xml" href="/favicon.svg" />
		<link rel="shortcut icon" href="/favicon.ico" />
		<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />

		<!-- app manifest stuff -->
		<meta name="apple-mobile-web-app-title" content="emily's nook" />
		<link rel="manifest" href="/site.webmanifest" />
		
		<!-- tab title -->
		<title>Emily Huang | Data Analyst</title>

		<script>
			try {
				const saved = localStorage.getItem("theme");
				const dark = saved ? saved === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
				document.documentElement.classList.toggle("dark", dark);
			} catch (e) {}
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
